{% extends "base.html" %}

{% block title %}Register Your Bus{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-lg p-4">

        <h2 class="text-center mb-4">
            🚌 Register Your Bus
        </h2>

        <h5 class="mb-3">
            Step 3 of 6 - Route Details
        </h5>

        <form action="/register-bus/step3" method="POST">

            <div class="mb-3">
                <label>From City</label>
                <input type="text"
                       name="from_city"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>To City</label>
                <input type="text"
                       name="to_city"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Boarding Point</label>
                <input type="text"
                       name="boarding_point"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Dropping Point</label>
                <input type="text"
                       name="dropping_point"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Journey Date</label>
                <input
                       type="date"
                       name="journey_date"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Departure Time</label>
                <input
                       type="time"
                       name="departure_time"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Arrival Time</label>
                <input
                       type="time"
                       name="arrival_time"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Ticket Fare (₹)</label>
                <input
                       type="number"
                       name="fare"
                       class="form-control"
                       placeholder="499"
                       required>
            </div>

            <div class="d-flex justify-content-between">

                <a href="/register-bus/step2"
                   class="btn btn-secondary">
                    ← Back
                </a>

                <button type="submit"
                        class="btn btn-danger">
                    Next →
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
